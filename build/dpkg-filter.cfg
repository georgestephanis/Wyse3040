# dpkg path filters, installed as /etc/dpkg/dpkg.cfg.d/99mmdebstrap in the
# image, so they keep applying to every later upgrade (new kernels included).
# Later lines override earlier ones. Patterns are fnmatch(): `*` crosses `/`.
#
# The goal is to drop what a Dell Wyse 3040 can never use. The build checks
# that every module the 3040 needs still resolves (see customize.sh).

# --- Documentation, translations ------------------------------------------
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/help/*
path-exclude=/usr/share/gtk-doc/*
path-exclude=/usr/share/lintian/*
path-exclude=/usr/share/bug/*
path-exclude=/usr/share/locale/*
path-include=/usr/share/locale/locale.alias
path-include=/usr/share/locale/en*

# --- Kernel modules for hardware the 3040 doesn't have -----------------------
# GPUs: only i915 (+ tiny/ for the bochs display used by `make test`).
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/amd/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/radeon/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/nouveau/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/xe/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/vmwgfx/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/gma500/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/ast/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/mgag200/*
path-exclude=/usr/lib/modules/*/kernel/drivers/gpu/drm/qxl/*
path-exclude=/usr/lib/modules/*/kernel/drivers/accel/*
# Wired NICs: only the onboard Realtek. (USB Ethernet adapters live in
# drivers/net/usb and are kept.)
path-exclude=/usr/lib/modules/*/kernel/drivers/net/ethernet/*
path-include=/usr/lib/modules/*/kernel/drivers/net/ethernet/realtek/*
# No SATA, NVMe, SAS/FC HBAs, InfiniBand or storage targets. USB storage
# still needs the SCSI core + disk/cdrom drivers.
path-exclude=/usr/lib/modules/*/kernel/drivers/ata/*
path-exclude=/usr/lib/modules/*/kernel/drivers/nvme/*
path-exclude=/usr/lib/modules/*/kernel/drivers/infiniband/*
path-exclude=/usr/lib/modules/*/kernel/drivers/target/*
path-exclude=/usr/lib/modules/*/kernel/drivers/scsi/*
path-include=/usr/lib/modules/*/kernel/drivers/scsi/scsi_mod.ko*
path-include=/usr/lib/modules/*/kernel/drivers/scsi/scsi_common.ko*
path-include=/usr/lib/modules/*/kernel/drivers/scsi/sd_mod.ko*
path-include=/usr/lib/modules/*/kernel/drivers/scsi/sr_mod.ko*
path-include=/usr/lib/modules/*/kernel/drivers/scsi/sg.ko*
# TV tuners, capture cards, cameras. i915 still needs the CEC and RC cores.
path-exclude=/usr/lib/modules/*/kernel/drivers/media/*
path-include=/usr/lib/modules/*/kernel/drivers/media/cec/*
path-include=/usr/lib/modules/*/kernel/drivers/media/rc/rc-core.ko*
# Lab data-acquisition cards; AMD audio DSPs.
path-exclude=/usr/lib/modules/*/kernel/drivers/comedi/*
path-exclude=/usr/lib/modules/*/kernel/sound/soc/amd/*

# --- Firmware: only the blobs the 3040's own chips load ----------------------
# RTL8111/8168 Ethernet.
path-exclude=/usr/lib/firmware/rtl_bt/*
path-exclude=/usr/lib/firmware/rtlwifi/*
path-exclude=/usr/lib/firmware/rtw88/*
path-exclude=/usr/lib/firmware/rtw89/*
# Cherry Trail audio DSP: only the SST firmware (Debian's kernel uses the SST
# driver, not SOF, on Bay Trail/Cherry Trail).
path-exclude=/usr/lib/firmware/intel/*.bin
path-include=/usr/lib/firmware/intel/fw_sst_22a8.bin
