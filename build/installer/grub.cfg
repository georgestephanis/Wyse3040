# Boot menu of the installer ISO. No timeout: nothing starts on its own.
# @BUILD_ID@ is filled in by build-image.sh and must match /live/build-id.
set timeout=-1
set default=0
insmod all_video
set gfxpayload=keep

menuentry "Install the Wyse 3040 thin-client image (asks before erasing the eMMC)" {
	linux /live/vmlinuz boot=wyseinstall wyse.build=@BUILD_ID@ quiet console=ttyS0,115200 console=tty0
	initrd /live/installer.img
}

menuentry "Rescue shell (writes nothing)" {
	linux /live/vmlinuz boot=wyseinstall wyse.shell console=ttyS0,115200 console=tty0
	initrd /live/installer.img
}

menuentry "Power off" {
	halt
}
