# Two DisplayPort monitors side by side, DP-1 primary on the left.
# Both run at 1080p even on a 4K screen: the 3040 only drives 4K at 30 Hz,
# its Atom can't keep up with RDP or game streams at 4K, and at native 4K
# everything on screen is tiny. The screen scales 1080p up to full size.
# Each DP port also shows up as HDMI-n when a passive DP-to-HDMI adapter or
# cable is used, so HDMI-n shares DP-n's section.
# Output names are the modesetting driver's; if a unit reports different ones
# (check ~wyse/.local/share/xorg/Xorg.0.log), adjust them here. Monitor
# sections that match no connected output are simply ignored.
Section "Device"
	Identifier "gpu"
	Driver     "modesetting"
	Option     "Monitor-DP-1" "DP-1"
	Option     "Monitor-DP-2" "DP-2"
	Option     "Monitor-HDMI-1" "DP-1"
	Option     "Monitor-HDMI-2" "DP-2"
EndSection

Section "Monitor"
	Identifier "DP-1"
	Option     "Primary" "true"
	Option     "PreferredMode" "1920x1080"
EndSection

Section "Monitor"
	Identifier "DP-2"
	Option     "RightOf" "DP-1"
	Option     "PreferredMode" "1920x1080"
EndSection
