# Loaded by the standalone GRUB on the ESP. /vmlinuz and /initrd.img are
# symlinks Debian keeps pointing at the newest kernel, so this file never
# needs regenerating on kernel upgrades.
set timeout=2
set default=0
insmod all_video
set gfxpayload=keep

menuentry "Wyse 3040 thin client" {
	search --no-floppy --label wyse-root --set=root
	linux /vmlinuz root=LABEL=wyse-root ro quiet console=ttyS0,115200 console=tty0
	initrd /initrd.img
}

menuentry "Wyse 3040 thin client (verbose, no X)" {
	search --no-floppy --label wyse-root --set=root
	linux /vmlinuz root=LABEL=wyse-root ro console=ttyS0,115200 console=tty0 wyse.nox
	initrd /initrd.img
}
